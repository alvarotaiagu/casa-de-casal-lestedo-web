<!-- script bloqueante: clases antes del primer pintado -->
<script>
(function (d) {
  var h = d.documentElement;
  h.classList.add('js');
  // MANDO DE MAQUETA (no viaja al cliente): solo con ?revision
  try {
    var q = new URLSearchParams(location.search);
    if (q.has('revision')) {
      h.classList.add('revision');
      if (q.get('densidad') === 'sobria') h.classList.add('densidad-sobria');
    }
  } catch (e) {}
  // la cortina de la portada, una vez por sesión y nunca si se llega con ancla
  // (spec 001 §3.1.7): sin ella antes del primer pintado. Si sessionStorage
  // falla, sale como siempre. main.js guarda la marca al terminar la cortina.
  try {
    if (location.hash.length > 1 || sessionStorage.getItem('cdc-cortina')) h.classList.add('cortina-fuera');
  } catch (e) {}
  // red de seguridad por si main.js no llega: la cortina se va sola
  window.__redCortina = setTimeout(function () { h.classList.add('cortina-fuera'); }, 6500);
})(document);
</script>
