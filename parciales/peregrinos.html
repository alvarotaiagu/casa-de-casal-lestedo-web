<!-- «Si haces el Camino»: en la portada (Alrededores) y en /entorno/ (spec 001 §3.4.11 y §3.5) -->
    <aside class="peregrinos" aria-labelledby="pere-tit" data-revela>
      <h3 id="pere-tit">Si haces el Camino</h3>
      <p>La casa está a 300 metros de la <b>Vía de la Plata</b> (Camino Sanabrés), a 13 km de la catedral: el sitio para descansar antes de la última etapa. <b>No está en el Camino Francés</b>. Hay otro Lestedo, en Palas de Rei, que sí lo está: mira bien el pueblo al reservar.</p>
    </aside>
